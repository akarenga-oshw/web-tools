<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web tools — tests</title>
<style>
  body{margin:0; background:#0f1113; color:#dfe3e6;
       font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; font-size:13px; line-height:1.7}
  .wrap{max-width:900px; margin:0 auto; padding:32px 20px 64px}
  h1{font-size:20px; margin:0 0 4px}
  p.sub{color:#8b959c; margin:0 0 24px; font-size:12px}
  #summary{font-size:16px; padding:10px 14px; border-radius:5px; margin-bottom:18px; display:inline-block}
  #summary.pass{background:#1d3320; color:#8fd694}
  #summary.fail{background:#3a1f1f; color:#e98b88}
  h2{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8b959c;
     margin:26px 0 8px; border-bottom:1px solid #2c3237; padding-bottom:6px}
  .case{padding:1px 0}
  .ok::before {content:"PASS"; color:#6fbf73; margin-right:12px}
  .bad::before{content:"FAIL"; color:#d9534f; margin-right:12px}
  .bad{color:#e98b88}
  .note{color:#5a6469; margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>web tools — tests</h1>
  <p class="sub">Everything here runs without a board. Open this page, or load it in headless Chrome.</p>
  <div id="summary">running…</div>
  <div id="out"></div>
</div>

<script type="module">
import { parseIntelHex } from '../renesas-ra-flasher/hex.js';
import { frame, cmdPacket, dataPacket, be32, rd32, CMD, SOH, SOD, ETX }
  from '../renesas-ra-flasher/boot.js';
import { plan } from '../renesas-ra-flasher/plan.js';
import { sha256Hex } from '../shared/digest.js';
import { RA_USB_BOOT, AKARENGA_UNO_R4_MINIMA, AKARENGA_UNO_R4_MINIMA_DFU, describe }
  from '../shared/devices.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(name, cond, note) {
  const d = document.createElement('div');
  d.className = 'case ' + (cond ? 'ok' : 'bad');
  d.textContent = name;
  if (note) { const s = document.createElement('span'); s.className = 'note'; s.textContent = note; d.append(s); }
  out.append(d);
  cond ? pass++ : fail++;
}

function rejects(name, fn, re) {
  try { fn(); check(name, false, 'no exception was thrown'); }
  catch (e) { check(name, !re || re.test(e.message), e.message); }
}

/* Run a group in isolation. Without this, one throw outside a check() ends the
   whole page and the remaining groups silently never run, which reads as a
   pass unless you count the cases. */
function group(name, body) {
  const h = document.createElement('h2'); h.textContent = name; out.append(h);
  try { body(); }
  catch (e) { check(`${name} did not finish`, false, e && e.message ? e.message : String(e)); }
}

/* Emit valid Intel HEX for a block of bytes, so the parser can be checked
   against data this file generated rather than against a committed fixture. */
function makeHex(addr, bytes, perLine = 16) {
  const rec = (len, off, type, data) => {
    const b = [len, (off >> 8) & 0xff, off & 0xff, type, ...data];
    const sum = (0x100 - (b.reduce((a, v) => a + v, 0) & 0xff)) & 0xff;
    return ':' + [...b, sum].map(v => v.toString(16).padStart(2, '0').toUpperCase()).join('');
  };
  const lines = [];
  let upper = -1;
  for (let i = 0; i < bytes.length; i += perLine) {
    const a = addr + i;
    const hi = (a >>> 16) & 0xffff;
    if (hi !== upper) { lines.push(rec(2, 0, 0x04, [(hi >> 8) & 0xff, hi & 0xff])); upper = hi; }
    const chunk = Array.from(bytes.slice(i, i + perLine));
    lines.push(rec(chunk.length, a & 0xffff, 0x00, chunk));
  }
  lines.push(rec(0, 0, 0x01, []));
  return lines.join('\n');
}

group('Intel HEX', () => {
  {
    const bytes = new Uint8Array(1000);
    for (let i = 0; i < bytes.length; i++) bytes[i] = (i * 7) & 0xff;
    const segs = parseIntelHex(makeHex(0, bytes));
    check('consecutive records merge into one segment', segs.length === 1, `got ${segs.length}`);
    check('starts where it was written', segs[0].addr === 0);
    check('keeps every byte', segs[0].data.length === bytes.length, `${segs[0].data.length}`);
    check('the bytes survive the round trip', segs[0].data.every((v, i) => v === bytes[i]));
  }
  {
    const segs = parseIntelHex(makeHex(0x00011000, new Uint8Array([0x41, 0x42, 0x43, 0x44])));
    check('an extended linear address raises the top half',
      segs[0].addr === 0x00011000, '0x' + segs[0].addr.toString(16));
  }
  {
    /* A gap has to break the segment, or the image would be written shifted. */
    const a = makeHex(0x0000, new Uint8Array([1, 2, 3, 4])).replace(/\n:00000001FF$/, '');
    const b = makeHex(0x2000, new Uint8Array([5, 6, 7, 8]));
    const segs = parseIntelHex(a + '\n' + b);
    check('a gap starts a new segment', segs.length === 2, `got ${segs.length}`);
    check('the second segment keeps its address', segs[1].addr === 0x2000,
      '0x' + segs[1].addr.toString(16));
  }
  rejects('a line without a colon is refused', () => parseIntelHex('00000001FF'), /does not start/);
  rejects('an odd length is refused',          () => parseIntelHex(':0'),          /odd number/);
  rejects('a bad checksum is refused',         () => parseIntelHex(':00000001FE'), /checksum/);
  rejects('a file with no data is refused',    () => parseIntelHex(':00000001FF'), /no data records/);
  {
    /* Corrupting one byte of a real-looking file has to be caught: a truncated
       download looks exactly like this. */
    const good = makeHex(0, new Uint8Array([1, 2, 3, 4]));
    const bad = good.replace('01020304', '01020305');
    rejects('a single flipped byte is caught', () => parseIntelHex(bad), /checksum/);
  }
});

group('Packet framing', () => {
  const sums = (p, from, to) => Array.from(p.slice(from, to)).reduce((a, b) => a + b, 0) & 0xff;
  {
    const p = cmdPacket(CMD.SIG);
    check('a command with no payload is 6 bytes', p.length === 6,
      Array.from(p, b => b.toString(16).padStart(2, '0')).join(' '));
    check('starts with SOH', p[0] === SOH);
    check('the length counts the command byte', p[1] === 0 && p[2] === 1);
    check('carries the command', p[3] === CMD.SIG);
    check('ends with ETX', p[5] === ETX);
    check('LNH through SUM add up to zero', sums(p, 1, 5) === 0);
  }
  {
    const p = cmdPacket(CMD.AREA, new Uint8Array([0]));
    check('a one byte payload makes a 7 byte packet', p.length === 7);
    check('the length counts the payload too', p[1] === 0 && p[2] === 2);
    check('LNH through SUM add up to zero', sums(p, 1, 6) === 0);
  }
  {
    const payload = new Uint8Array(1024).fill(0xA5);
    const p = cmdPacket(CMD.WRITE, payload);
    check('a 1024 byte payload sets the high length byte', p[1] === 0x04 && p[2] === 0x01,
      `${p[1]} ${p[2]}`);
    check('LNH through SUM add up to zero', sums(p, 1, p.length - 1) === 0);
  }
  {
    const p = dataPacket(CMD.WRITE, new Uint8Array([0xAA, 0xBB]));
    check('a data packet starts with SOD', p[0] === SOD);
    check('LNH through SUM add up to zero', sums(p, 1, p.length - 1) === 0);
  }
  check('frame builds either kind', frame(SOH, CMD.SIG, new Uint8Array(0))[0] === SOH &&
                                    frame(SOD, CMD.SIG, new Uint8Array(0))[0] === SOD);
});

group('Byte order', () => {
  {
    const a = be32(0x12345678);
    check('be32 is big endian', a[0] === 0x12 && a[1] === 0x34 && a[2] === 0x56 && a[3] === 0x78);
    check('be32 handles the top bit', be32(0xFF000001)[0] === 0xFF);
    check('rd32 comes back unsigned',
      rd32(new Uint8Array([0xFF, 0, 0, 1]), 0) === 0xFF000001,
      String(rd32(new Uint8Array([0xFF, 0, 0, 1]), 0)));
    check('be32 and rd32 are inverses', rd32(be32(0xDEADBEEF), 0) === 0xDEADBEEF);
  }
});

group('Device identities', () => {
  check('the ROM boot firmware is 045B:0261', describe(RA_USB_BOOT) === '045B:0261', describe(RA_USB_BOOT));
  check('a running sketch is 2886:806A',
    describe(AKARENGA_UNO_R4_MINIMA) === '2886:806A', describe(AKARENGA_UNO_R4_MINIMA));
  check('the DFU bootloader is 2886:006A',
    describe(AKARENGA_UNO_R4_MINIMA_DFU) === '2886:006A', describe(AKARENGA_UNO_R4_MINIMA_DFU));
  check('the three are distinct', new Set([
    describe(RA_USB_BOOT), describe(AKARENGA_UNO_R4_MINIMA), describe(AKARENGA_UNO_R4_MINIMA_DFU),
  ]).size === 3);
});

group('Planning a write', () => {
  const CODE = { koa: 0, kind: 'code flash', sad: 0x00000000, ead: 0x0003FFFF, eau: 2048, wau: 8 };
  const seg = (addr, len, fill = 0xA5) => ({ addr, data: new Uint8Array(len).fill(fill) });

  {
    const p = plan([seg(0, 100)], [CODE]);
    check('erases from the start of the containing block', p.start === 0, '0x' + p.start.toString(16));
    check('erases to the end of the containing block', p.end === 2047, p.end);
    check('the image covers the erased range', p.image.length === 2048, p.image.length);
  }
  {
    /* Rounding has to go outwards at both ends, or the erase would leave part
       of the image sitting in a block that was never cleared. */
    const p = plan([seg(2040, 20)], [CODE]);
    check('rounds down to the block the data starts in', p.start === 0, '0x' + p.start.toString(16));
    check('rounds up past the block it ends in', p.end === 4095, p.end);
    check('spans both blocks', p.image.length === 4096, p.image.length);
  }
  {
    const p = plan([seg(0, 4, 0x11), seg(64, 4, 0x22)], [CODE]);
    check('places each segment at its own offset',
      p.image[0] === 0x11 && p.image[64] === 0x22, `${p.image[0]} ${p.image[64]}`);
    check('fills the gap with 0xFF', p.image[4] === 0xFF && p.image[63] === 0xFF);
    check('fills past the last byte with 0xFF', p.image[68] === 0xFF);
  }
  {
    const p = plan([seg(0x8000, 16)], [CODE]);
    check('a block well past zero is not rounded to zero', p.start === 0x8000,
      '0x' + p.start.toString(16));
    check('offsets are relative to start, not to zero', p.image[0] === 0xA5, p.image[0]);
  }

  /* Writing an ID code into the config area can disable serial programming for
     good, so a file that reaches into it has to stop the write rather than be
     quietly trimmed to the part that fits. */
  const CONFIG = { koa: 2, kind: 'config', sad: 0x01010008, ead: 0x01010033, eau: 0, wau: 4 };
  rejects('a segment inside the config area stops the write',
    () => plan([seg(0, 16), seg(0x01010008, 4)], [CODE, CONFIG]), /config/i);
  rejects('overlapping the config area by one byte is enough',
    () => plan([seg(0x01010033, 1)], [CODE, CONFIG]), /config/i);
  rejects('a segment that runs into the config area stops the write',
    () => plan([seg(0x01010000, 16)], [CODE, CONFIG]), /config/i);

  /* Only code flash is ever written, so a file reaching anywhere else would be
     written in part and reported as done. Refuse instead of trimming. */
  const DATA = { koa: 1, kind: 'data flash', sad: 0x40100000, ead: 0x40101FFF, eau: 1024, wau: 4 };
  rejects('a segment in data flash stops the write',
    () => plan([seg(0, 16), seg(0x40100000, 8)], [CODE, DATA]), /data flash/i);
  rejects('a segment in no area at all stops the write',
    () => plan([seg(0, 16), seg(0x90000000, 8)], [CODE, DATA]), /outside/i);
  rejects('a segment running past the end of code flash stops the write',
    () => plan([seg(0x0003FFF8, 16)], [CODE]), /outside|past/i);
  rejects('a file with nothing in code flash stops the write',
    () => plan([seg(0x40100000, 8)], [CODE, DATA]), /data flash/i);
  rejects('a part reporting no code flash stops the write',
    () => plan([seg(0, 16)], [DATA]), /code flash/i);

  {
    /* The boundary itself is fine: the last byte of code flash is writable. */
    const p = plan([seg(0x0003FFFC, 4)], [CODE]);
    check('the very last block of code flash is allowed', p.end === 0x0003FFFF,
      '0x' + p.end.toString(16));
  }
  {
    /* Not every part reports a config area, and one that does not must still
       be writable. */
    const p = plan([seg(0, 16)], [CODE]);
    check('a part with no config area still plans a write', p.image.length === 2048);
  }
  {
    /* The write command takes whole write units. An erase block is a multiple
       of one on every part seen so far, but the image is what gets sent, so
       check it rather than assume. */
    const p = plan([seg(0, 100)], [CODE]);
    check('the image is a whole number of write units',
      p.image.length % CODE.wau === 0, `${p.image.length} % ${CODE.wau}`);
  }
  {
    /* What is written must never reach past what was erased, so when the erase
       block is not a multiple of the write unit the erased range has to grow,
       not the image alone. */
    const ODD = Object.assign({}, CODE, { eau: 100, wau: 8 });
    const p = plan([seg(0, 10)], [ODD]);
    check('the image is a whole number of write units', p.image.length % 8 === 0, p.image.length);
    check('the image fills the erased range exactly',
      p.image.length === p.end - p.start + 1, `${p.image.length} vs ${p.end - p.start + 1}`);
    check('the erased range is a whole number of erase blocks',
      (p.end - p.start + 1) % 100 === 0, p.end - p.start + 1);
  }
});

/* sha256Hex is async, so this group awaits rather than returning. */
await (async () => {
  const h = document.createElement('h2'); h.textContent = 'Digest'; out.append(h);
  try {
    const enc = new TextEncoder();
    /* The published release note carries the SHA-256 of the .hex file, so what
       the page shows has to be the digest of the bytes as downloaded. */
    check('matches the known digest of the empty input',
      await sha256Hex(new Uint8Array(0)) ===
        'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855');
    check('matches the known digest of "abc"',
      await sha256Hex(enc.encode('abc')) ===
        'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
    check('is lower case hex, 64 characters',
      /^[0-9a-f]{64}$/.test(await sha256Hex(enc.encode('x'))));
    check('accepts an ArrayBuffer as well as a view',
      await sha256Hex(enc.encode('abc').buffer) === await sha256Hex(enc.encode('abc')));
  } catch (e) {
    check('Digest did not finish', false, e && e.message ? e.message : String(e));
  }
})();

/* ── Summary ── */
const s = document.getElementById('summary');
s.className = fail ? 'fail' : 'pass';
s.textContent = fail ? `${fail} failed, ${pass} passed` : `all ${pass} passed`;
document.title = s.textContent;
</script>
</body>
</html>
